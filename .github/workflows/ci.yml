name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Resolve dependencies that actually support our rust-version instead of taking the
      # newest and failing, so a transitive release that declares a higher rustc does not
      # break the MSRV job. It cannot help when a crate declares no rust-version at all:
      # yoke-derive 0.8.3 (via `url` -> `idna` -> `icu_*`) needs 1.87 and says nothing,
      # which is why the MSRV moved from 1.85 to 1.88 in Sep 2026.
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    strategy:
      fail-fast: false
      matrix:
        # The MSRV in Cargo.toml, and whatever is current.
        rust: ['1.88', stable]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
        if: matrix.rust == 'stable'

      - run: cargo clippy --all-features --all-targets -- -D warnings
        if: matrix.rust == 'stable'

      # On the MSRV we check what a consumer actually compiles: the library and the
      # examples. Tests are deliberately not run there — dev-dependencies never reach a
      # consumer, so their MSRV is not ours to honour, and pinning them to whatever still
      # builds on the MSRV means chasing every release (wiremock 0.6.5 moved to edition-2024
      # let-chains, which need 1.88). Stable runs the full suite.
      - run: cargo check --all-features
        if: matrix.rust != 'stable'

      - run: cargo check --no-default-features --features rustls-tls
        if: matrix.rust != 'stable'

      - run: cargo test --all-features
        if: matrix.rust == 'stable'

      # The doctests need every feature; the lib and integration tests have to
      # build without them too, or a `default-features = false` user is broken.
      - run: cargo test --no-default-features --features rustls-tls --lib --tests
        if: matrix.rust == 'stable'

      # Examples can use dev-dependencies, so building them pulls wiremock in too.
      - run: cargo build --examples --all-features
        if: matrix.rust == 'stable'

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # Same invocation docs.rs uses, so a broken intra-doc link fails here first.
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
