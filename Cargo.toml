[package]
name = "fopost"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Official Rust SDK for the FoPost API. Schedule and publish to +30 social platforms from your code."
license = "MIT"
readme = "README.md"
homepage = "https://fopost.com"
repository = "https://github.com/fopost/fopost-rust"
documentation = "https://docs.rs/fopost"
keywords = ["fopost", "social-media", "publishing", "scheduling", "api"]
categories = ["api-bindings", "web-programming::http-client"]
exclude = [".github/", "tests/"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0.181", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[features]
default = ["rustls-tls", "multipart"]
# TLS backends — pick one. rustls needs no system OpenSSL.
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]
# Media upload and bulk CSV import, which post multipart bodies. On by default;
# turn the defaults off to drop it.
multipart = ["reqwest/multipart"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
